experiments:
- data_file: estimation.csv
  columns:
  - name: time
    units: s
  - name: level_lower
    units: V
    observes: x2
  - name: pump_voltage
    units: V
    role: forcing
    interpolation: linear
model:
  trainable_parameters:
  - name: k1
    min_val: 0.001
    max_val: 10.0
    logscale: true
  - name: k2
    min_val: 0.001
    max_val: 10.0
    logscale: true
  - name: k3
    min_val: 0.001
    max_val: 10.0
    logscale: true
  - name: k4
    min_val: 0.001
    max_val: 10.0
    logscale: true
  integrated_variables:
  - name: x1
    init_val: 5.0
  - name: x2
    init_val: 5.205
population_opt:
  population_size: 100
  num_iters: 30
  processors: 8
  algorithm: DE
  random_seed: 0
  stepsize_rtol: 1.0e-05
  stepsize_atol: 1.0e-07
gradient_opt:
  num_iters: 1000
  stepsize_rtol: 1.0e-07
  stepsize_atol: 1.0e-09
  initial_timestep: 0.001
  initial_time: 0.0
  max_steps: 10000
  integrator: Kvaerno5
  gradient_optimizer: lbfgs
  init_value_lr: 0.001
  end_value_lr: 1.0e-05
  transition_steps_lr: 200
  decay_rate_lr: 0.9
output:
  write_results: true
