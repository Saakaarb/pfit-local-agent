experiments:
- data_file: pulse.csv
  initial_conditions: {}
  columns:
  - name: time
  - name: dose_rate
    role: forcing
    interpolation: linear
  - name: signal
    observes: signal_model
- data_file: washout.csv
  initial_conditions:
    R: 0.3
  columns:
  - name: time
  - name: dose_rate
    role: forcing
    interpolation: linear
  - name: signal
    observes: signal_model
model:
  trainable_parameters:
  - name: k_elim
    min_val: 0.01
    max_val: 10.0
    logscale: true
  - name: k_on
    min_val: 0.001
    max_val: 10.0
    logscale: true
  - name: k_off
    min_val: 0.001
    max_val: 10.0
    logscale: true
  - name: baseline
    min_val: 50.0
    max_val: 150.0
    logscale: false
  - name: gain
    min_val: 1.0
    max_val: 200.0
    logscale: false
  fixed_parameters: []
  integrated_variables:
  - name: D
    init_val: 0.0
  - name: R
    init_val: 0.0
  observables:
  - name: signal_model
population_opt:
  population_size: 48
  num_iters: 120
  processors: 1
  algorithm: DE
gradient_opt:
  gradient_optimizer: lbfgs
  num_iters: 1000
  stepsize_rtol:
  - 1.0e-07
  - 1.0e-07
  stepsize_atol:
  - 1.0e-09
  - 1.0e-09
  initial_timestep: 0.0001
  max_steps: 10000
  integrator: Tsit5
  init_value_lr: 0.001
  end_value_lr: 1.0e-05
  transition_steps_lr: 1000
  decay_rate_lr: 0.9
output:
  write_results: true
