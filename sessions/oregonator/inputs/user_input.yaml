# Oregonator: the Field-Noyes model of the Belousov-Zhabotinsky reaction, in
# Tyson's dimensionless scaling.
#
#   eps1 * dX/dt =  q*Y - X*Y + X*(1 - X)
#   eps2 * dY/dt = -q*Y - X*Y + f*Z
#          dZ/dt =  X - Z
#
# X is HBrO2, Y is bromide, Z is the oxidised catalyst. X and Z are recorded;
# Y is not observed at all, so its initial value is an assumption rather than a
# measurement.
#
# The record is a synthetic relaxation-oscillator trace: ~4.7 periods, 300
# samples, 2% additive noise on each channel's peak. It exists to test the
# search against a loss surface dominated by period and phase - the generating
# parameters are known, so recovery is scoreable.
#
# data.csv columns:
#   0 time [dimensionless]
#   1-2  X, Z
#   3-4  the measurement standard deviations, same order (constant per channel)

experiments:
  - data_file: data.csv
    columns:
      - {name: time, units: s}
      - {name: X, units: dimensionless, observes: X}
      - {name: Z, units: dimensionless, observes: Z}
      - {name: X_sd, units: dimensionless, uncertainty_of: X}
      - {name: Z_sd, units: dimensionless, uncertainty_of: Z}

model:
  # Ranges are the literature value v mapped to [v/100, v*100]
  # (pfit-new step 5); each spans four decades, hence logscale.
  #
  # Note that only part of the f range oscillates at all - outside roughly
  # 0.5 < f < 2.4 the system settles to a steady state and reproduces none of
  # the record. Most of this box is therefore non-oscillatory, which is the
  # point of the test.
  trainable_parameters:
    - {name: eps1, min_val: 4.0e-04, max_val: 4.0e+00, logscale: true}
    - {name: eps2, min_val: 4.0e-06, max_val: 4.0e-02, logscale: true}
    - {name: q, min_val: 8.0e-06, max_val: 8.0e-02, logscale: true}
    - {name: f, min_val: 1.0e-02, max_val: 1.0e+02, logscale: true}
  integrated_variables:
    # X and Z are the first recorded sample; Y is unmeasured and its value here
    # is the state the generating trajectory happened to be in - an assumption
    # a real experiment could not supply.
    - {name: X, init_val: 0.778383715217}
    - {name: Y, init_val: 0.267086592467}
    - {name: Z, init_val: 0.208522420421}

population_opt:
  population_size: 200
  num_iters: 40
  processors: 16
  algorithm: DE
  random_seed: 0
  stepsize_rtol: 1.0e-06
  stepsize_atol: [1.0e-09, 1.0e-07, 1.0e-09]

gradient_opt:
  num_iters: 1000
  stepsize_rtol: 1.0e-09
  stepsize_atol: [1.0e-11, 1.0e-09, 1.0e-11]
  initial_timestep: 1.0e-06
  initial_time: 0.0
  # 1.0e+06 rather than 200000: the stiff corner of the box (eps2 = 4.0e-06)
  # implies ~7.1e+06 steps and the box centre ~6.4e+04, and a candidate that
  # exhausts max_steps is scored error_loss - indistinguishable from a bad
  # parameter set (R10 in generated/user_input_check.txt).
  max_steps: 1000000
  integrator: Kvaerno5
  gradient_optimizer: adam
  init_value_lr: 1.0e-03
  end_value_lr: 1.0e-05
  transition_steps_lr: 200
  decay_rate_lr: 0.9

output:
  write_results: true
