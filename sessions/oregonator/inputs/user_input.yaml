experiments:
  - data_file: data.csv
    columns:
      - {name: time}
      - {name: X, observes: X}
      - {name: Z, observes: Z}
      - {name: X_sd, uncertainty_of: X}
      - {name: Z_sd, uncertainty_of: Z}

model:
  trainable_parameters:
    - {name: eps1, min_val: 0.0004, max_val: 4.0, logscale: true}
    - {name: eps2, min_val: 4e-06, max_val: 0.04, logscale: true}
    - {name: q, min_val: 8e-06, max_val: 0.08, logscale: true}
    - {name: f, min_val: 0.01, max_val: 100.0, logscale: true}
  fixed_parameters: []
  integrated_variables:
    - {name: X, init_val: 0.778383715217}
    - {name: Y, init_val: 0.267086592467}
    - {name: Z, init_val: 0.208522420421}
  observables: []

population_opt:
  population_size: 16
  num_iters: 5
  processors: 1
  algorithm: DE

gradient_opt:
  num_iters: 5
  stepsize_rtol: [1e-7, 1e-7, 1e-7]
  stepsize_atol: [1e-9, 1e-9, 1e-9]
  initial_timestep: 1e-6
  max_steps: 10000
  integrator: Kvaerno5
  init_value_lr: 1e-4
  end_value_lr: 1e-5
  transition_steps_lr: 2000
  decay_rate_lr: 0.9

output:
  write_results: true
