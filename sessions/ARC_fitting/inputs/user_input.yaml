experiments:
  - data_file: NMC_SOC80_M2_normalized_converted_units.csv
    columns:
      - {name: time}
      - {name: T, observes: T}
      - {name: dTdt, observes: dTdt}

model:
  trainable_parameters:
    - {name: Ea1, min_val: 2e-19, max_val: 4e-19, logscale: true}
    - {name: h1, min_val: 10.0, max_val: 1000.0, logscale: true}
    - {name: A1, min_val: 100000000.0, max_val: 1e+25, logscale: true}
    - {name: A2, min_val: 100000000.0, max_val: 1e+25, logscale: true}
    - {name: Ea2, min_val: 2e-19, max_val: 4e-19, logscale: true}
    - {name: h2, min_val: 10.0, max_val: 1000.0, logscale: true}
    - {name: m2, min_val: 1.0, max_val: 5.0, logscale: false}
    - {name: n2, min_val: 1.0, max_val: 5.0, logscale: false}
  fixed_parameters:
    - {name: kb, value: 1.38e-23}
  integrated_variables:
    - {name: c1, init_val: 1.0}
    - {name: c2, init_val: 0.04}
    - {name: T, init_val: 354.0}
  observables:
    - {name: dTdt}

population_opt:
  population_size: 16
  num_iters: 5
  processors: 1
  algorithm: DE

gradient_opt:
  num_iters: 5
  stepsize_rtol: [1e-7, 1e-7, 1e-7]
  stepsize_atol: [1e-9, 1e-9, 1e-9]
  initial_timestep: 1e-6
  max_steps: 10000
  integrator: Kvaerno5
  init_value_lr: 1e-4
  end_value_lr: 1e-5
  transition_steps_lr: 2000
  decay_rate_lr: 0.9

output:
  write_results: true
