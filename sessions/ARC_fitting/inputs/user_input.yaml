experiments:
- data_file: NMC_SOC80_M2_normalized_converted_units.csv
  columns:
  - name: time
  - name: c1
    observes: c1
  - name: c2
    observes: c2
  - name: T
    observes: T
model:
  trainable_parameters:
  - name: Ea1
    min_val: 2.0e-19
    max_val: 4.0e-19
    logscale: true
  - name: h1
    min_val: 10.0
    max_val: 1000.0
    logscale: true
  - name: A1
    min_val: 100000000.0
    max_val: 1.0e+25
    logscale: true
  - name: A2
    min_val: 100000000.0
    max_val: 1.0e+25
    logscale: true
  - name: Ea2
    min_val: 2.0e-19
    max_val: 4.0e-19
    logscale: true
  - name: h2
    min_val: 10.0
    max_val: 1000.0
    logscale: true
  - name: m2
    min_val: 1.0
    max_val: 5.0
    logscale: false
  - name: n2
    min_val: 1.0
    max_val: 5.0
    logscale: false
  fixed_parameters:
  - name: kb
    value: 1.38e-23
  integrated_variables:
  - name: c1
    init_val: 1.0
  - name: c2
    init_val: 0.04
  - name: T
    init_val: 354.0
population_opt:
  population_size: 200
  num_iters: 50
  processors: 8
  algorithm: PSO
  stepsize_rtol:
  - 0.001
  - 0.001
  - 0.001
  stepsize_atol:
  - 0.001
  - 0.001
  - 0.001
gradient_opt:
  num_iters: 20
  stepsize_rtol:
  - 1.0e-07
  - 1.0e-07
  - 1.0e-09
  stepsize_atol:
  - 1.0e-09
  - 1.0e-09
  - 1.0e-09
  initial_timestep: 0.01
  max_steps: 10000
  init_value_lr: 0.0001
  end_value_lr: 1.0e-05
  transition_steps_lr: 500.0
  decay_rate_lr: 0.9
output:
  write_results: true
