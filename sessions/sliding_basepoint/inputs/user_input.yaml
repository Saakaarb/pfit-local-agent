experiments:
  - data_file: force_disp_data_sliding_basepoint.csv
    columns:
      - {name: time, units: s}
      - {name: contact_force, units: kN, observes: contact_force}
      - {name: displacement, units: m, observes: x1}

model:
  trainable_parameters:
    - {name: c2, min_val: 1.0e+04, max_val: 1.0e+07, logscale: true}
    - {name: Dk, min_val: 1.0e-03, max_val: 10.0, logscale: true}
    - {name: Dc, min_val: 0.1, max_val: 1.0, logscale: false}
    - {name: m1, min_val: 1.0e+02, max_val: 1.0e+04, logscale: true}
    - {name: m2, min_val: 1.0, max_val: 1.0e+02, logscale: true}
  fixed_parameters:
    - {name: vf, value: 0.1}
  observables:
    - {name: contact_force}
  integrated_variables:
    - {name: x1, init_val: 0.0}
    - {name: x2, init_val: 0.0}
    - {name: v1, init_val: 11.06}
    - {name: v2, init_val: 0.0}
    - {name: k, init_val: 1.29e+06}
    - {name: c1, init_val: 0.0}

population_opt:
  population_size: 2000
  num_iters: 60
  processors: 16
  algorithm: DE
  stepsize_rtol: [1.0e-02, 1.0e-02, 1.0e-02, 1.0e-02, 1.0e-04, 1.0e-04]
  stepsize_atol: [1.0e-06, 1.0e-06, 1.0e-04, 1.0e-04, 1.0e+00, 1.0e+00]

gradient_opt:
  num_iters: 1000
  stepsize_rtol: [1.0e-04, 1.0e-04, 1.0e-04, 1.0e-04, 1.0e-06, 1.0e-06]
  stepsize_atol: [1.0e-08, 1.0e-08, 1.0e-06, 1.0e-06, 1.0e-02, 1.0e-02]
  initial_timestep: 1.0e-06
  initial_time: 0.0
  max_steps: 10000
  integrator: Dopri8
  gradient_optimizer: adam
  init_value_lr: 1.0e-03
  end_value_lr: 1.0e-05
  transition_steps_lr: 100
  decay_rate_lr: 0.9

output:
  write_results: true
