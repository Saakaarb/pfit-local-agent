experiments:
- data_file: robertson_data.csv
  columns:
  - name: time
  - name: y1
    observes: y1
  - name: y2
    observes: y2
  - name: y3
    observes: y3
model:
  trainable_parameters:
  - name: k1
    min_val: 0.001
    max_val: 10.0
    logscale: true
  - name: k2
    min_val: 5000.0
    max_val: 50000000000.0
    logscale: true
  - name: k3
    min_val: 1.0
    max_val: 100000000.0
    logscale: true
  fixed_parameters: []
  integrated_variables:
  - name: y1
    init_val: 1.0
  - name: y2
    init_val: 0.0
  - name: y3
    init_val: 0.0
population_opt:
  population_size: 100
  num_iters: 20
  processors: 8
  algorithm: PSO
  stepsize_rtol:
  - 0.001
  - 0.001
  - 0.001
  stepsize_atol:
  - 0.001
  - 0.001
  - 0.001
gradient_opt:
  num_iters: 10
  stepsize_rtol:
  - 1.0e-07
  - 1.0e-07
  - 1.0e-07
  stepsize_atol:
  - 1.0e-09
  - 1.0e-09
  - 1.0e-09
  initial_timestep: 1.0e-06
  max_steps: 10000
  init_value_lr: 0.0001
  end_value_lr: 1.0e-05
  transition_steps_lr: 2000.0
  decay_rate_lr: 0.9
output:
  write_results: true
