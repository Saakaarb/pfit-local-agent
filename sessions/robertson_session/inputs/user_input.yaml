experiments:
  - data_file: robertson_data.csv
    columns:
      - {name: time}
      - {name: y1, observes: y1}
      - {name: y2, observes: y2}
      - {name: y3, observes: y3}

model:
  trainable_parameters:
    - {name: k1, min_val: 0.001, max_val: 10.0, logscale: true}
    - {name: k2, min_val: 5000.0, max_val: 50000000000.0, logscale: true}
    - {name: k3, min_val: 1.0, max_val: 100000000.0, logscale: true}
  fixed_parameters: []
  integrated_variables:
    - {name: y1, init_val: 1.0}
    - {name: y2, init_val: 0.0}
    - {name: y3, init_val: 0.0}
  observables: []

population_opt:
  population_size: 16
  num_iters: 5
  processors: 1
  algorithm: DE

gradient_opt:
  num_iters: 5
  stepsize_rtol: [1e-7, 1e-7, 1e-7]
  stepsize_atol: [1e-9, 1e-9, 1e-9]
  initial_timestep: 1e-6
  max_steps: 10000
  integrator: Kvaerno5
  init_value_lr: 1e-4
  end_value_lr: 1e-5
  transition_steps_lr: 2000
  decay_rate_lr: 0.9

output:
  write_results: true
