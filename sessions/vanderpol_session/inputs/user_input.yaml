experiments:
  - data_file: vanderpol_data.csv
    columns:
      - {name: time}
      - {name: x1, observes: x1}
      - {name: x2, observes: x2}

model:
  trainable_parameters:
    - {name: mu, min_val: 0.001, max_val: 100.0, logscale: true}
  fixed_parameters: []
  integrated_variables:
    - {name: x1, init_val: 2.0}
    - {name: x2, init_val: 0.1}
  observables: []

population_opt:
  population_size: 16
  num_iters: 5
  processors: 1
  algorithm: DE

gradient_opt:
  num_iters: 5
  stepsize_rtol: [1e-7, 1e-7]
  stepsize_atol: [1e-9, 1e-9]
  initial_timestep: 1e-6
  max_steps: 10000
  integrator: Tsit5
  init_value_lr: 1e-4
  end_value_lr: 1e-5
  transition_steps_lr: 2000
  decay_rate_lr: 0.9

output:
  write_results: true
