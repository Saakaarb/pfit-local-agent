experiments:
  - data_file: data.csv
    columns:
      - {name: time}
      - {name: pSTAT5A, observes: pSTAT5A}
      - {name: pSTAT5B, observes: pSTAT5B}
      - {name: rSTAT5A, observes: rSTAT5A}

model:
  trainable_parameters:
    - {name: k_deg, min_val: 0.00027, max_val: 2.7, logscale: true}
    - {name: k_exp_hetero, min_val: 1e-07, max_val: 0.001, logscale: true}
    - {name: k_exp_homo, min_val: 6.17e-05, max_val: 0.617, logscale: true}
    - {name: k_imp_hetero, min_val: 0.000164, max_val: 1.64, logscale: true}
    - {name: k_imp_homo, min_val: 977.0, max_val: 9770000.0, logscale: true}
    - {name: k_phos, min_val: 158.0, max_val: 1580000.0, logscale: true}
  fixed_parameters:
    - {name: specC17, value: 0.107}
    - {name: Epo0, value: 1.25e-07}
    - {name: cyt, value: 1.4}
    - {name: nuc, value: 0.45}
  integrated_variables:
    - {name: A, init_val: 143.8668}
    - {name: B, init_val: 63.7332}
    - {name: ApB, init_val: 0.0}
    - {name: ApA, init_val: 0.0}
    - {name: BpB, init_val: 0.0}
    - {name: nApA, init_val: 0.0}
    - {name: nApB, init_val: 0.0}
    - {name: nBpB, init_val: 0.0}
  observables:
    - {name: pSTAT5A}
    - {name: pSTAT5B}
    - {name: rSTAT5A}

population_opt:
  population_size: 16
  num_iters: 5
  processors: 1
  algorithm: DE

gradient_opt:
  num_iters: 5
  stepsize_rtol: [1e-7, 1e-7, 1e-7, 1e-7, 1e-7, 1e-7, 1e-7, 1e-7]
  stepsize_atol: [1e-9, 1e-9, 1e-9, 1e-9, 1e-9, 1e-9, 1e-9, 1e-9]
  initial_timestep: 1e-6
  max_steps: 10000
  integrator: Kvaerno5
  init_value_lr: 1e-4
  end_value_lr: 1e-5
  transition_steps_lr: 2000
  decay_rate_lr: 0.9

output:
  write_results: true
