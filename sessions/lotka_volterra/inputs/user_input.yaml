experiments:
- data_file: lynx_hare.csv
  columns:
  - name: time
  - name: H
    observes: H
  - name: L
    observes: L
model:
  trainable_parameters:
  - name: alpha
    min_val: 0.1
    max_val: 2.0
    logscale: true
  - name: beta
    min_val: 0.001
    max_val: 0.5
    logscale: true
  - name: delta
    min_val: 0.001
    max_val: 0.5
    logscale: true
  - name: gamma
    min_val: 0.1
    max_val: 2.0
    logscale: true
  fixed_parameters: []
  integrated_variables:
  - name: H
    init_val: 30.0
  - name: L
    init_val: 4.0
population_opt:
  population_size: 100
  num_iters: 30
  processors: 8
  algorithm: PSO
gradient_opt:
  num_iters: 20
  stepsize_rtol:
  - 1.0e-06
  - 1.0e-06
  stepsize_atol:
  - 1.0e-08
  - 1.0e-08
  initial_timestep: 0.01
  max_steps: 5000
  init_value_lr: 0.001
  end_value_lr: 0.0001
  transition_steps_lr: 1000.0
  decay_rate_lr: 0.9
output:
  write_results: true
