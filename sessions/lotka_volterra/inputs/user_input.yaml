experiments:
  - data_file: lynx_hare.csv
    columns:
      - {name: time}
      - {name: H, observes: H}
      - {name: L, observes: L}

model:
  trainable_parameters:
    - {name: alpha, min_val: 0.1, max_val: 2.0, logscale: true}
    - {name: beta, min_val: 0.001, max_val: 0.5, logscale: true}
    - {name: delta, min_val: 0.001, max_val: 0.5, logscale: true}
    - {name: gamma, min_val: 0.1, max_val: 2.0, logscale: true}
  fixed_parameters: []
  integrated_variables:
    - {name: H, init_val: 30.0}
    - {name: L, init_val: 4.0}
  observables: []

population_opt:
  population_size: 16
  num_iters: 5
  processors: 1
  algorithm: DE

gradient_opt:
  num_iters: 5
  stepsize_rtol: [1e-7, 1e-7]
  stepsize_atol: [1e-9, 1e-9]
  initial_timestep: 1e-6
  max_steps: 10000
  init_value_lr: 1e-4
  end_value_lr: 1e-5
  transition_steps_lr: 2000
  decay_rate_lr: 0.9

output:
  write_results: true
