experiments:
- data_file: mapk_data.csv
  columns:
  - name: time
  - name: M
    observes: M
  - name: Mp
    observes: Mp
  - name: Mpp
    observes: Mpp
  - name: MAPKK
    observes: MAPKK
  - name: MKP3
    observes: MKP3
  - name: M_MAPKK
    observes: M_MAPKK
  - name: Mp_MAPKK
    observes: Mp_MAPKK
  - name: Mpp_MKP3
    observes: Mpp_MKP3
  - name: Mp_MKP3_dep
    observes: Mp_MKP3_dep
  - name: Mp_MKP3
    observes: Mp_MKP3
  - name: M_MKP3
    observes: M_MKP3
model:
  trainable_parameters:
  - name: k1
    min_val: 0.001
    max_val: 1.0
    logscale: true
  - name: k_1
    min_val: 0.01
    max_val: 100.0
    logscale: true
  - name: k2
    min_val: 0.001
    max_val: 1.0
    logscale: true
  - name: k3
    min_val: 0.001
    max_val: 1.0
    logscale: true
  - name: k_3
    min_val: 0.01
    max_val: 100.0
    logscale: true
  - name: k4
    min_val: 1.0
    max_val: 1000.0
    logscale: true
  - name: h1
    min_val: 0.001
    max_val: 1.0
    logscale: true
  - name: h_1
    min_val: 0.01
    max_val: 100.0
    logscale: true
  - name: h2
    min_val: 0.001
    max_val: 1.0
    logscale: true
  - name: h3
    min_val: 0.01
    max_val: 100.0
    logscale: true
  - name: h_3
    min_val: 0.0001
    max_val: 1.0
    logscale: true
  - name: h4
    min_val: 0.0001
    max_val: 1.0
    logscale: true
  - name: h_4
    min_val: 0.01
    max_val: 100.0
    logscale: true
  - name: h5
    min_val: 0.01
    max_val: 10.0
    logscale: true
  - name: h6
    min_val: 0.001
    max_val: 1.0
    logscale: true
  - name: h_6
    min_val: 0.0001
    max_val: 0.1
    logscale: true
  fixed_parameters: []
  integrated_variables:
  - name: M
    init_val: 500.0
  - name: Mp
    init_val: 0.0
  - name: Mpp
    init_val: 0.0
  - name: MAPKK
    init_val: 50.0
  - name: MKP3
    init_val: 100.0
  - name: M_MAPKK
    init_val: 0.0
  - name: Mp_MAPKK
    init_val: 0.0
  - name: Mpp_MKP3
    init_val: 0.0
  - name: Mp_MKP3_dep
    init_val: 0.0
  - name: Mp_MKP3
    init_val: 0.0
  - name: M_MKP3
    init_val: 0.0
population_opt:
  population_size: 200
  num_iters: 50
  processors: 8
  algorithm: PSO
gradient_opt:
  num_iters: 30
  stepsize_rtol:
  - 1.0e-06
  - 1.0e-06
  - 1.0e-06
  - 1.0e-06
  - 1.0e-06
  - 1.0e-06
  - 1.0e-06
  - 1.0e-06
  - 1.0e-06
  - 1.0e-06
  - 1.0e-06
  stepsize_atol:
  - 1.0e-09
  - 1.0e-09
  - 1.0e-09
  - 1.0e-09
  - 1.0e-09
  - 1.0e-09
  - 1.0e-09
  - 1.0e-09
  - 1.0e-09
  - 1.0e-09
  - 1.0e-09
  initial_timestep: 0.01
  max_steps: 10000
  init_value_lr: 0.001
  end_value_lr: 0.0001
  transition_steps_lr: 2000.0
  decay_rate_lr: 0.9
output:
  write_results: true
