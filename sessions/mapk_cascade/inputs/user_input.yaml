experiments:
  - data_file: mapk_data.csv
    columns:
      - {name: time}
      - {name: Mpp, observes: Mpp}

model:
  trainable_parameters:
    - {name: k1, min_val: 0.001, max_val: 1.0, logscale: true}
    - {name: k_1, min_val: 0.01, max_val: 100.0, logscale: true}
    - {name: k2, min_val: 0.001, max_val: 1.0, logscale: true}
    - {name: k3, min_val: 0.001, max_val: 1.0, logscale: true}
    - {name: k_3, min_val: 0.01, max_val: 100.0, logscale: true}
    - {name: k4, min_val: 1.0, max_val: 1000.0, logscale: true}
    - {name: h1, min_val: 0.001, max_val: 1.0, logscale: true}
    - {name: h_1, min_val: 0.01, max_val: 100.0, logscale: true}
    - {name: h2, min_val: 0.001, max_val: 1.0, logscale: true}
    - {name: h3, min_val: 0.01, max_val: 100.0, logscale: true}
    - {name: h_3, min_val: 0.0001, max_val: 1.0, logscale: true}
    - {name: h4, min_val: 0.0001, max_val: 1.0, logscale: true}
    - {name: h_4, min_val: 0.01, max_val: 100.0, logscale: true}
    - {name: h5, min_val: 0.01, max_val: 10.0, logscale: true}
    - {name: h6, min_val: 0.001, max_val: 1.0, logscale: true}
    - {name: h_6, min_val: 0.0001, max_val: 0.1, logscale: true}
  fixed_parameters: []
  integrated_variables:
    - {name: M, init_val: 500.0}
    - {name: Mp, init_val: 0.0}
    - {name: Mpp, init_val: 0.0}
    - {name: MAPKK, init_val: 50.0}
    - {name: MKP3, init_val: 100.0}
    - {name: M_MAPKK, init_val: 0.0}
    - {name: Mp_MAPKK, init_val: 0.0}
    - {name: Mpp_MKP3, init_val: 0.0}
    - {name: Mp_MKP3_dep, init_val: 0.0}
    - {name: Mp_MKP3, init_val: 0.0}
    - {name: M_MKP3, init_val: 0.0}
  observables: []

population_opt:
  population_size: 16
  num_iters: 5
  processors: 1
  algorithm: DE

gradient_opt:
  num_iters: 5
  stepsize_rtol: [1e-7, 1e-7, 1e-7, 1e-7, 1e-7, 1e-7, 1e-7, 1e-7, 1e-7, 1e-7, 1e-7]
  stepsize_atol: [1e-9, 1e-9, 1e-9, 1e-9, 1e-9, 1e-9, 1e-9, 1e-9, 1e-9, 1e-9, 1e-9]
  initial_timestep: 1e-6
  max_steps: 10000
  integrator: Tsit5
  init_value_lr: 1e-4
  end_value_lr: 1e-5
  transition_steps_lr: 2000
  decay_rate_lr: 0.9

output:
  write_results: true
