experiments:
- data_file: decay_run_A.csv
  initial_conditions:
    A: 1.0
    B: 0.0
  columns:
  - name: time
  - name: A
    observes: A
  - name: B
    observes: B
- data_file: decay_run_B.csv
  initial_conditions:
    A: 2.0
    B: 0.5
  columns:
  - name: time
  - name: A
    observes: A
  - name: B
    observes: B
model:
  trainable_parameters:
  - name: k1
    min_val: 0.01
    max_val: 10.0
    logscale: true
  - name: k2
    min_val: 0.01
    max_val: 10.0
    logscale: true
  fixed_parameters: []
  integrated_variables:
  - name: A
    init_val: 1.0
  - name: B
    init_val: 0.0
  observables: []
population_opt:
  population_size: 64
  num_iters: 100
  processors: 16
  algorithm: DE
  random_seed: 7
  stepsize_rtol:
  - 1.0e-06
  - 1.0e-06
  stepsize_atol:
  - 2.0e-08
  - 5.7442991839287925e-09
gradient_opt:
  gradient_optimizer: adam
  num_iters: 3000
  auto_state_tolerances: true
  stepsize_rtol:
  - 1e-7
  - 1e-7
  stepsize_atol:
  - 2.0e-09
  - 5.744299183928793e-10
  initial_timestep: 1e-6
  max_steps: 1000
  auto_max_steps: true
  solver_recovery_max_steps: 50000
  solver_recovery_timeout_seconds: 900
  solver_validation_min_successful: 10
  solver_validation_seed: 7
  solver_accuracy_check: true
  solver_accuracy_workers: 4
  auto_integrator: true
  integrator: Kvaerno5
  init_value_lr: 0.0001
  end_value_lr: 1.0e-06
  transition_steps_lr: 2999
  decay_rate_lr: 0.01
output:
  write_results: true
