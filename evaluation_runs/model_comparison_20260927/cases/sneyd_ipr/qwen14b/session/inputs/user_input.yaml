population_opt:
  population_size: 4
  num_iters: 1
  processors: 1
  algorithm: DE
  random_seed: 7
gradient_opt:
  gradient_optimizer: adam
  num_iters: 5
  stepsize_rtol:
  - 1e-7
  - 1e-7
  - 1e-7
  - 1e-7
  - 1e-7
  - 1e-7
  - 1e-7
  - 1e-7
  stepsize_atol:
  - 1e-9
  - 1e-9
  - 1e-9
  - 1e-9
  - 1e-9
  - 1e-9
  - 1e-9
  - 1e-9
  initial_timestep: 1e-6
  max_steps: 10000
  integrator: Kvaerno5
  init_value_lr: 1e-4
  end_value_lr: 1e-5
  transition_steps_lr: 2000
  decay_rate_lr: 0.9
output:
  write_results: true
