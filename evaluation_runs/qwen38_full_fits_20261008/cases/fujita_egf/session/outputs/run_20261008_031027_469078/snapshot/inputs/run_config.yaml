population_opt:
  population_size: 128
  num_iters: 100
  processors: 16
  algorithm: DE
  random_seed: 7
gradient_opt:
  gradient_optimizer: adam
  num_iters: 3000
  auto_state_tolerances: true
  stepsize_rtol:
  - 1e-7
  - 1e-7
  - 1e-7
  - 1e-7
  - 1e-7
  - 1e-7
  - 1e-7
  - 1e-7
  - 1e-7
  - 1e-7
