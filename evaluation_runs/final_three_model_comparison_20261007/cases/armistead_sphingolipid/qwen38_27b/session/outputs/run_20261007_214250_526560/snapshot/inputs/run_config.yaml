model:
  trainable_parameters:
  - name: k00
    min_val: 0.001
    max_val: 1000.0
    logscale: true
  - name: k0
    min_val: 0.001
    max_val: 1000.0
    logscale: true
  - name: k_d
    min_val: 0.001
    max_val: 1000.0
    logscale: true
  - name: k1
    min_val: 0.001
    max_val: 1000.0
    logscale: true
  - name: k2
    min_val: 0.001
    max_val: 1000.0
    logscale: true
  - name: k3
    min_val: 0.001
    max_val: 1000.0
    logscale: true
  - name: k4
    min_val: 0.001
    max_val: 1000.0
    logscale: true
  - name: k5
    min_val: 0.001
    max_val: 1000.0
    logscale: true
  - name: alpha_hai1a
    min_val: 0.5
    max_val: 0.999
    logscale: false
  - name: alpha_cer
    min_val: -0.999
    max_val: -0.001
    logscale: false
  fixed_parameters: []
  integrated_variables:
  - name: Sphinga
    init_val: 0.000732
  - name: Cer
    init_val: 0.988
  - name: Sphingo
    init_val: 0.000395
  - name: S1P
    init_val: 1.551
  - name: H
    init_val: 1.0
  observables:
  - name: Sphinga_obs
  - name: Cer_obs
  - name: Sphingo_obs
population_opt:
  population_size: 4
  num_iters: 1
  processors: 1
  algorithm: DE
  random_seed: 7
  stepsize_rtol:
  - 1.0e-06
  - 1.0e-06
  - 1.0e-06
  - 1.0e-06
  - 1.0e-06
  stepsize_atol:
  - 2.400145887402358e-09
  - 9.880000000000001e-09
  - 7.663524083125085e-10
  - 2.07e-08
  - 1.0e-08
gradient_opt:
  gradient_optimizer: adam
  num_iters: 5
  auto_state_tolerances: true
  stepsize_rtol:
  - 1e-7
  - 1e-7
  - 1e-7
  - 1e-7
  - 1e-7
  stepsize_atol:
  - 2.400145887402358e-10
  - 9.880000000000001e-10
  - 7.663524083125084e-11
  - 2.07e-09
  - 1.0e-09
  initial_timestep: 1e-6
  max_steps: 10000
  auto_max_steps: true
  solver_recovery_max_steps: 50000
  solver_recovery_timeout_seconds: 900
  solver_validation_min_successful: 10
  solver_validation_seed: 7
  solver_accuracy_check: true
  solver_accuracy_workers: 4
  auto_integrator: true
  integrator: Kvaerno5
  init_value_lr: 1e-4
  end_value_lr: 1e-5
  transition_steps_lr: 2000
  decay_rate_lr: 0.9
output:
  write_results: true
paths:
  user_input_dir: inputs
  generated_dir: generated
  output_dir: outputs
