experiments:
  - data_file: "force_disp_data_sliding_basepoint.csv"
    initial_conditions: {"x1": 0.0, "x2": 0.0, "v1": 11.06, "v2": 0.0, "k": 1290000.0, "c1": 0.0}
    columns:
      - {name: time}
      - {name: contact_force, observes: contact_force}
      - {name: displacement, observes: displacement}

model:
  trainable_parameters:
    - {name: c2, min_val: 10000.0, max_val: 10000000.0, logscale: true}
    - {name: Dk, min_val: 0.001, max_val: 10.0, logscale: true}
    - {name: Dc, min_val: 0.1, max_val: 1.0, logscale: false}
    - {name: m1, min_val: 100.0, max_val: 10000.0, logscale: true}
    - {name: m2, min_val: 1.0, max_val: 100.0, logscale: true}
  fixed_parameters:
    - {name: vf, value: 0.1}
  integrated_variables:
    - {name: x1, init_val: 0.0}
    - {name: x2, init_val: 0.0}
    - {name: v1, init_val: 11.06}
    - {name: v2, init_val: 0.0}
    - {name: k, init_val: 1290000.0}
    - {name: c1, init_val: 0.0}
  observables:
    - {name: contact_force}
    - {name: displacement}

population_opt:
  population_size: 16
  num_iters: 5
  processors: 1
  algorithm: DE

gradient_opt:
  gradient_optimizer: adam
  num_iters: 1000
  auto_state_tolerances: true
  stepsize_rtol: [1e-7, 1e-7, 1e-7, 1e-7, 1e-7, 1e-7]
  stepsize_atol: [1e-9, 1e-9, 1e-9, 1e-9, 1e-9, 1e-9]
  initial_timestep: 1e-6
  max_steps: 10000
  auto_max_steps: true
  solver_recovery_max_steps: 50000
  solver_recovery_timeout_seconds: 900
  solver_validation_min_successful: 10
  solver_validation_seed: 7
  solver_accuracy_check: true
  solver_accuracy_workers: 4
  auto_integrator: true
  integrator: Kvaerno5
  init_value_lr: 1e-4
  end_value_lr: 1e-5
  transition_steps_lr: 2000
  decay_rate_lr: 0.9

output:
  write_results: true
