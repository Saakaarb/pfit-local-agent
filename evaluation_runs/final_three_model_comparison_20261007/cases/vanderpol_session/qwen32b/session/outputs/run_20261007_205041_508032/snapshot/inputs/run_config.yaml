experiments:
- data_file: dataset_1.csv
  initial_conditions:
    x1: 2.0
    x2: 0.1
  columns:
  - name: time
  - name: x1
    observes: x1
  - name: x2
    observes: x2
model:
  trainable_parameters:
  - name: mu
    min_val: 0.001
    max_val: 100.0
    logscale: true
  fixed_parameters: []
  integrated_variables:
  - name: x1
    init_val: 2.0
  - name: x2
    init_val: 0.1
  observables: []
population_opt:
  population_size: 4
  num_iters: 1
  processors: 1
  algorithm: DE
  random_seed: 7
gradient_opt:
  gradient_optimizer: adam
  num_iters: 5
  auto_state_tolerances: true
  stepsize_rtol:
  - 1e-7
  - 1e-7
  stepsize_atol:
  - 2.0e-09
  - 1.1001484366006488e-08
  initial_timestep: 1e-6
  max_steps: 2000
  auto_max_steps: true
  solver_recovery_max_steps: 50000
  solver_recovery_timeout_seconds: 900
  solver_validation_min_successful: 10
  solver_validation_seed: 7
  solver_accuracy_check: true
  solver_accuracy_workers: 4
  auto_integrator: true
  integrator: Tsit5
  init_value_lr: 1e-4
  end_value_lr: 1e-5
  transition_steps_lr: 2000
  decay_rate_lr: 0.9
output:
  write_results: true
paths:
  user_input_dir: inputs
  generated_dir: generated
  output_dir: outputs
