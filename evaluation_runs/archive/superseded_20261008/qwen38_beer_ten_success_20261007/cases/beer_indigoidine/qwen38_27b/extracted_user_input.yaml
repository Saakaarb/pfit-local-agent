experiments:
  - data_file: "culture.csv"
    initial_conditions: {"Bac": 0.013816608995338, "Glu": 10.0, "cGlu": 0.0, "Ind": 0.0}
    columns:
      - {name: time}
      - {name: Bacnorm, observes: Bacnorm}
      - {name: IndconcNormRange, observes: IndconcNormRange}

model:
  trainable_parameters:
    - {name: Bacmax, min_val: 1e-05, max_val: 100000.0, logscale: true}
    - {name: beta, min_val: 1e-05, max_val: 100000.0, logscale: true}
    - {name: ksyn, min_val: 1e-05, max_val: 100000.0, logscale: true}
    - {name: kdim, min_val: 1e-05, max_val: 100000.0, logscale: true}
    - {name: kdegi, min_val: 1e-05, max_val: 100000.0, logscale: true}
  fixed_parameters:
    - {name: tau, value: 0.163686586774761}
  integrated_variables:
    - {name: Bac, init_val: 0.013816608995338}
    - {name: Glu, init_val: 10.0}
    - {name: cGlu, init_val: 0.0}
    - {name: Ind, init_val: 0.0}
  observables:
    - {name: Bacnorm}
    - {name: IndconcNormRange}

population_opt:
  population_size: 16
  num_iters: 5
  processors: 1
  algorithm: DE

gradient_opt:
  gradient_optimizer: adam
  num_iters: 1000
  auto_state_tolerances: true
  stepsize_rtol: [1e-7, 1e-7, 1e-7, 1e-7]
  stepsize_atol: [1e-9, 1e-9, 1e-9, 1e-9]
  initial_timestep: 1e-6
  max_steps: 10000
  auto_max_steps: true
  solver_recovery_max_steps: 50000
  solver_recovery_timeout_seconds: 120
  solver_validation_samples: 32
  solver_validation_max_samples: 128
  solver_validation_min_successful: 10
  solver_validation_seed: 7
  solver_accuracy_check: true
  solver_accuracy_workers: 4
  auto_integrator: true
  integrator: Kvaerno5
  init_value_lr: 1e-4
  end_value_lr: 1e-5
  transition_steps_lr: 2000
  decay_rate_lr: 0.9

output:
  write_results: true
