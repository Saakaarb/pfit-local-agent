experiments:
- data_file: NMC_SOC80_M2_normalized_converted_units.csv
  initial_conditions:
    c1: 1.0
    c2: 0.04
    T: 354.0
  columns:
  - name: time
  - name: T
    observes: T
  - name: dTdt
    observes: dTdt
model:
  trainable_parameters:
  - name: Ea1
    min_val: 2e-19
    max_val: 4e-19
    logscale: true
  - name: h1
    min_val: 10.0
    max_val: 1000.0
    logscale: true
  - name: A1
    min_val: 100000000.0
    max_val: 1e+25
    logscale: true
  - name: A2
    min_val: 100000000.0
    max_val: 1e+25
    logscale: true
  - name: Ea2
    min_val: 2e-19
    max_val: 4e-19
    logscale: true
  - name: h2
    min_val: 10.0
    max_val: 1000.0
    logscale: true
  - name: m2
    min_val: 1.0
    max_val: 5.0
    logscale: false
  - name: n2
    min_val: 1.0
    max_val: 5.0
    logscale: false
  fixed_parameters:
  - name: kb
    value: 1.38e-23
  integrated_variables:
  - name: c1
    init_val: 1.0
  - name: c2
    init_val: 0.04
  - name: T
    init_val: 354.0
  observables:
  - name: dTdt
population_opt:
  population_size: 4
  num_iters: 1
  processors: 1
  algorithm: DE
  random_seed: 7
  stepsize_rtol:
  - 1.0e-06
  - 1.0e-06
  - 1.0e-06
  stepsize_atol:
  - 1.0e-08
  - 4.000000718499426e-10
  - 3.5401050201126996e-06
gradient_opt:
  gradient_optimizer: adam
  num_iters: 5
  auto_state_tolerances: true
  stepsize_rtol:
  - 1e-7
  - 1e-7
  - 1e-7
  stepsize_atol:
  - 1.0e-09
  - 4.000000718499426e-11
  - 3.5401050201127e-07
  initial_timestep: 1e-6
  max_steps: 10000
  solver_recovery_max_steps: 50000
  solver_recovery_timeout_seconds: 120
  solver_validation_samples: 32
  solver_validation_max_samples: 128
  solver_validation_success_fraction: 0.25
  solver_validation_seed: 7
  solver_recovery_stagnation_patience: 2
  solver_accuracy_check: true
  solver_accuracy_workers: 4
  auto_integrator: true
  integrator: Tsit5
  init_value_lr: 1e-4
  end_value_lr: 1e-5
  transition_steps_lr: 2000
  decay_rate_lr: 0.9
output:
  write_results: true
