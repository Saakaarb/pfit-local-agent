experiments:
- data_file: dataset_1.csv
  initial_conditions:
    xp: 0.0
    vp: 0.0
    h: 0.0
  columns:
  - name: time
  - name: xp
    observes: xp
model:
  trainable_parameters:
  - name: alpha
    min_val: 0.0
    max_val: 1.0
    logscale: false
  - name: beta
    min_val: 0.0
    max_val: 0.1
    logscale: false
  - name: gamma
    min_val: 0.0
    max_val: 0.1
    logscale: false
  - name: cp
    min_val: 20.0
    max_val: 30.0
    logscale: false
  - name: kp
    min_val: 10000000.0
    max_val: 15000000.0
    logscale: true
  - name: de
    min_val: 1e-07
    max_val: 1.5e-07
    logscale: true
  fixed_parameters:
  - name: mp
    value: 0.1
  integrated_variables:
  - name: xp
    init_val: 0.0
  - name: vp
    init_val: 0.0
  - name: h
    init_val: 0.0
  observables: []
population_opt:
  population_size: 4
  num_iters: 1
  processors: 1
  algorithm: DE
  random_seed: 7
  stepsize_rtol:
  - 1.0e-06
  - 1.0e-06
  - 1.0e-06
  stepsize_atol:
  - 2.408855332249747e-10
  - 9.894652714160575e-09
  - 2.4082553977329784e-10
gradient_opt:
  gradient_optimizer: adam
  num_iters: 5
  auto_state_tolerances: true
  stepsize_rtol:
  - 1e-7
  - 1e-7
  - 1e-7
  stepsize_atol:
  - 2.408855332249747e-11
  - 9.894652714160574e-10
  - 2.4082553977329784e-11
  initial_timestep: 1e-6
  max_steps: 16000
  auto_max_steps: true
  solver_recovery_max_steps: 50000
  solver_recovery_timeout_seconds: 120
  solver_validation_min_successful: 10
  solver_validation_seed: 7
  solver_accuracy_check: true
  solver_accuracy_workers: 4
  auto_integrator: true
  integrator: Tsit5
  init_value_lr: 1e-4
  end_value_lr: 1e-5
  transition_steps_lr: 2000
  decay_rate_lr: 0.9
output:
  write_results: true
paths:
  user_input_dir: inputs
  generated_dir: generated
  output_dir: outputs
