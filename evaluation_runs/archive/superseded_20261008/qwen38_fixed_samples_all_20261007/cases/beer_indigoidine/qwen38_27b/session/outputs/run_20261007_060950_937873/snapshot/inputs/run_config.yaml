experiments:
- data_file: dataset_1.csv
  initial_conditions:
    Bac: 0.013816608995338
    Glu: 10.0
    cGlu: 0.0
    Ind: 0.0
  columns:
  - name: time
  - name: Bacnorm
    observes: Bacnorm
  - name: IndconcNormRange
    observes: IndconcNormRange
model:
  trainable_parameters:
  - name: Bacmax
    min_val: 1e-05
    max_val: 100000.0
    logscale: true
  - name: beta
    min_val: 1e-05
    max_val: 100000.0
    logscale: true
  - name: ksyn
    min_val: 1e-05
    max_val: 100000.0
    logscale: true
  - name: kdim
    min_val: 1e-05
    max_val: 100000.0
    logscale: true
  - name: kdegi
    min_val: 1e-05
    max_val: 100000.0
    logscale: true
  fixed_parameters:
  - name: tau
    value: 0.163686586774761
  integrated_variables:
  - name: Bac
    init_val: 0.013816608995338
  - name: Glu
    init_val: 10.0
  - name: cGlu
    init_val: 0.0
  - name: Ind
    init_val: 0.0
  observables:
  - name: Bacnorm
  - name: IndconcNormRange
population_opt:
  population_size: 4
  num_iters: 1
  processors: 1
  algorithm: DE
  random_seed: 7
  stepsize_rtol:
  - 1.0e-06
  - 1.0e-06
  - 1.0e-06
  - 1.0e-06
  stepsize_atol:
  - 1.3816608995338e-10
  - 1.0e-07
  - 3.231170698600771e-10
  - 1.628483172938675e-09
gradient_opt:
  gradient_optimizer: adam
  num_iters: 5
  auto_state_tolerances: true
  stepsize_rtol:
  - 1e-7
  - 1e-7
  - 1e-7
  - 1e-7
  stepsize_atol:
  - 1.3816608995338001e-11
  - 1.0e-08
  - 3.231170698600771e-11
  - 1.6284831729386748e-10
  initial_timestep: 1e-6
  max_steps: 1000
  auto_max_steps: true
  solver_recovery_max_steps: 50000
  solver_recovery_timeout_seconds: 120
  solver_validation_min_successful: 10
  solver_validation_seed: 7
  solver_accuracy_check: true
  solver_accuracy_workers: 4
  auto_integrator: true
  integrator: Tsit5
  init_value_lr: 1e-4
  end_value_lr: 1e-5
  transition_steps_lr: 2000
  decay_rate_lr: 0.9
output:
  write_results: true
paths:
  user_input_dir: inputs
  generated_dir: generated
  output_dir: outputs
