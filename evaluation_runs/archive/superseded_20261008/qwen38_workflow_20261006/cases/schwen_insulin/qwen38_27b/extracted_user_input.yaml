experiments:
  - data_file: "insulin_10_r1.csv"
    initial_conditions: {"Ins": 10.0, "Rec1": 58.8503656504712, "Rec2": 918.6048612429337, "IR1": 0.0, "IR2": 0.0, "IR1in": 0.0, "IR2in": 0.0, "Uptake1": 0.0, "Uptake2": 0.0, "InsulinFragments": 0.0, "BoundUnspec": 0.0}
    columns:
      - {name: time}
      - {name: Insulin_signal, observes: Insulin_signal}
  - data_file: "insulin_10_r2.csv"
    initial_conditions: {"Ins": 10.0, "Rec1": 58.8503656504712, "Rec2": 918.6048612429337, "IR1": 0.0, "IR2": 0.0, "IR1in": 0.0, "IR2in": 0.0, "Uptake1": 0.0, "Uptake2": 0.0, "InsulinFragments": 0.0, "BoundUnspec": 0.0}
    columns:
      - {name: time}
      - {name: Insulin_signal, observes: Insulin_signal}
  - data_file: "insulin_100_r1.csv"
    initial_conditions: {"Ins": 100.0, "Rec1": 58.8503656504712, "Rec2": 918.6048612429337, "IR1": 0.0, "IR2": 0.0, "IR1in": 0.0, "IR2in": 0.0, "Uptake1": 0.0, "Uptake2": 0.0, "InsulinFragments": 0.0, "BoundUnspec": 0.0}
    columns:
      - {name: time}
      - {name: Insulin_signal, observes: Insulin_signal}
  - data_file: "insulin_100_r2.csv"
    initial_conditions: {"Ins": 100.0, "Rec1": 58.8503656504712, "Rec2": 918.6048612429337, "IR1": 0.0, "IR2": 0.0, "IR1in": 0.0, "IR2in": 0.0, "Uptake1": 0.0, "Uptake2": 0.0, "InsulinFragments": 0.0, "BoundUnspec": 0.0}
    columns:
      - {name: time}
      - {name: Insulin_signal, observes: Insulin_signal}

model:
  trainable_parameters:
    - {name: ka1, min_val: 1e-05, max_val: 1000.0, logscale: true}
    - {name: ka2fold, min_val: 1e-05, max_val: 1000.0, logscale: true}
    - {name: kd1, min_val: 1e-05, max_val: 1000.0, logscale: true}
    - {name: kd2fold, min_val: 1e-05, max_val: 1000.0, logscale: true}
    - {name: kin, min_val: 1e-05, max_val: 1000.0, logscale: true}
    - {name: kin2, min_val: 1e-05, max_val: 1000.0, logscale: true}
    - {name: kout, min_val: 1e-05, max_val: 1000.0, logscale: true}
    - {name: kout2, min_val: 1e-05, max_val: 1000.0, logscale: true}
    - {name: kout_frag, min_val: 1e-05, max_val: 1000.0, logscale: true}
    - {name: kon_unspec, min_val: 1e-05, max_val: 1000.0, logscale: true}
    - {name: koff_unspec, min_val: 1e-05, max_val: 1000.0, logscale: true}
    - {name: offset, min_val: 1e-05, max_val: 100000.0, logscale: true}
    - {name: km, min_val: 1000.0, max_val: 100000000.0, logscale: true}
    - {name: scale, min_val: 0.1, max_val: 1.0, logscale: false}
    - {name: fragments, min_val: 0.0, max_val: 1.0, logscale: false}
  fixed_parameters: []
  integrated_variables:
    - {name: Ins, init_val: 10.0}
    - {name: Rec1, init_val: 58.8503656504712}
    - {name: Rec2, init_val: 918.6048612429337}
    - {name: IR1, init_val: 0.0}
    - {name: IR2, init_val: 0.0}
    - {name: IR1in, init_val: 0.0}
    - {name: IR2in, init_val: 0.0}
    - {name: Uptake1, init_val: 0.0}
    - {name: Uptake2, init_val: 0.0}
    - {name: InsulinFragments, init_val: 0.0}
    - {name: BoundUnspec, init_val: 0.0}
  observables:
    - {name: Insulin_signal}

population_opt:
  population_size: 16
  num_iters: 5
  processors: 1
  algorithm: DE

gradient_opt:
  gradient_optimizer: adam
  num_iters: 1000
  stepsize_rtol: [1e-7, 1e-7, 1e-7, 1e-7, 1e-7, 1e-7, 1e-7, 1e-7, 1e-7, 1e-7, 1e-7]
  stepsize_atol: [1e-9, 1e-9, 1e-9, 1e-9, 1e-9, 1e-9, 1e-9, 1e-9, 1e-9, 1e-9, 1e-9]
  initial_timestep: 1e-6
  max_steps: 10000
  solver_recovery_max_steps: 50000
  solver_recovery_timeout_seconds: 120
  solver_validation_samples: 32
  solver_validation_max_samples: 128
  solver_validation_success_fraction: 0.25
  solver_validation_seed: 7
  solver_recovery_stagnation_patience: 2
  integrator: Kvaerno5
  init_value_lr: 1e-4
  end_value_lr: 1e-5
  transition_steps_lr: 2000
  decay_rate_lr: 0.9

output:
  write_results: true
