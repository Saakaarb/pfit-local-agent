experiments:
  - data_file: "estimation.csv"
    initial_conditions: {"x1": 5.0, "x2": 5.205}
    columns:
      - {name: time}
      - {name: level_lower, observes: level_lower}
      - {name: pump_voltage, role: forcing, interpolation: linear}

model:
  trainable_parameters:
    - {name: k1, min_val: 0.001, max_val: 10.0, logscale: true}
    - {name: k2, min_val: 0.001, max_val: 10.0, logscale: true}
    - {name: k3, min_val: 0.001, max_val: 10.0, logscale: true}
    - {name: k4, min_val: 0.001, max_val: 10.0, logscale: true}
  fixed_parameters: []
  integrated_variables:
    - {name: x1, init_val: 5.0}
    - {name: x2, init_val: 5.205}
  observables:
    - {name: level_lower}

population_opt:
  population_size: 16
  num_iters: 5
  processors: 1
  algorithm: DE

gradient_opt:
  gradient_optimizer: adam
  num_iters: 1000
  stepsize_rtol: [1e-7, 1e-7]
  stepsize_atol: [1e-9, 1e-9]
  initial_timestep: 1e-6
  max_steps: 10000
  solver_recovery_max_steps: 50000
  solver_recovery_timeout_seconds: 120
  solver_validation_samples: 32
  solver_validation_max_samples: 128
  solver_validation_success_fraction: 0.25
  solver_validation_seed: 7
  solver_recovery_stagnation_patience: 2
  integrator: Tsit5
  init_value_lr: 1e-4
  end_value_lr: 1e-5
  transition_steps_lr: 2000
  decay_rate_lr: 0.9

output:
  write_results: true
