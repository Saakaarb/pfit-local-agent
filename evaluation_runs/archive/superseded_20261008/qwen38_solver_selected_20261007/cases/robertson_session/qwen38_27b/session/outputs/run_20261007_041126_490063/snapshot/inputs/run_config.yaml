experiments:
- data_file: dataset_1.csv
  initial_conditions:
    y1: 1.0
    y2: 0.0
    y3: 0.0
  columns:
  - name: time
  - name: y1
    observes: y1
  - name: y2
    observes: y2
  - name: y3
    observes: y3
model:
  trainable_parameters:
  - name: k1
    min_val: 0.001
    max_val: 10.0
    logscale: true
  - name: k2
    min_val: 5000.0
    max_val: 50000000000.0
    logscale: true
  - name: k3
    min_val: 1.0
    max_val: 100000000.0
    logscale: true
  fixed_parameters: []
  integrated_variables:
  - name: y1
    init_val: 1.0
  - name: y2
    init_val: 0.0
  - name: y3
    init_val: 0.0
  observables: []
population_opt:
  population_size: 4
  num_iters: 1
  processors: 1
  algorithm: DE
  random_seed: 7
  stepsize_rtol:
  - 1.0e-06
  - 1.0e-06
  - 1.0e-06
  stepsize_atol:
  - 1.0e-08
  - 3.776884984970823e-12
  - 9.687758845029472e-09
gradient_opt:
  gradient_optimizer: adam
  num_iters: 5
  auto_state_tolerances: true
  stepsize_rtol:
  - 1e-7
  - 1e-7
  - 1e-7
  stepsize_atol:
  - 1.0e-09
  - 3.776884984970823e-13
  - 9.687758845029472e-10
  initial_timestep: 1e-6
  max_steps: 40000
  solver_recovery_max_steps: 50000
  solver_recovery_timeout_seconds: 120
  solver_validation_samples: 128
  solver_validation_max_samples: 128
  solver_validation_success_fraction: 0.25
  solver_validation_seed: 7
  solver_recovery_stagnation_patience: 2
  auto_integrator: true
  integrator: Tsit5
  init_value_lr: 1e-4
  end_value_lr: 1e-5
  transition_steps_lr: 2000
  decay_rate_lr: 0.9
output:
  write_results: true
paths:
  user_input_dir: inputs
  generated_dir: generated
  output_dir: outputs
