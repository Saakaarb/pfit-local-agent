experiments:
- data_file: lynx_hare.csv
  initial_conditions:
    H: 30.0
    L: 4.0
  columns:
  - name: time
  - name: H
    observes: H
  - name: L
    observes: L
model:
  trainable_parameters:
  - name: alpha
    min_val: 0.1
    max_val: 2.0
    logscale: true
  - name: beta
    min_val: 0.001
    max_val: 0.5
    logscale: true
  - name: delta
    min_val: 0.001
    max_val: 0.5
    logscale: true
  - name: gamma
    min_val: 0.1
    max_val: 2.0
    logscale: true
  fixed_parameters: []
  integrated_variables:
  - name: H
    init_val: 30.0
  - name: L
    init_val: 4.0
  observables: []
population_opt:
  population_size: 4
  num_iters: 1
  processors: 1
  algorithm: DE
  random_seed: 7
  stepsize_rtol:
  - 1.0e-06
  - 1.0e-06
  stepsize_atol:
  - 7.522358315970331e-07
  - 1.1521974522406734e-06
gradient_opt:
  gradient_optimizer: adam
  num_iters: 5
  auto_state_tolerances: true
  stepsize_rtol:
  - 1e-7
  - 1e-7
  stepsize_atol:
  - 7.52235831597033e-08
  - 1.1521974522406734e-07
  initial_timestep: 1e-6
  max_steps: 10000
  solver_recovery_max_steps: 50000
  solver_recovery_timeout_seconds: 120
  solver_validation_samples: 32
  solver_validation_max_samples: 128
  solver_validation_success_fraction: 0.25
  solver_validation_seed: 7
  solver_recovery_stagnation_patience: 2
  auto_integrator: true
  integrator: Tsit5
  init_value_lr: 1e-4
  end_value_lr: 1e-5
  transition_steps_lr: 2000
  decay_rate_lr: 0.9
output:
  write_results: true
