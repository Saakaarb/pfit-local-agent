experiments:
- data_file: data.csv
  initial_conditions:
    X: 0.778383715217
    Y: 0.267086592467
    Z: 0.208522420421
  columns:
  - name: time
  - name: X
    observes: X
  - name: Z
    observes: Z
  - name: X_sd
    uncertainty_of: X
  - name: Z_sd
    uncertainty_of: Z
model:
  trainable_parameters:
  - name: eps1
    min_val: 0.0004
    max_val: 4.0
    logscale: true
  - name: eps2
    min_val: 4e-06
    max_val: 0.04
    logscale: true
  - name: q
    min_val: 8e-06
    max_val: 0.08
    logscale: true
  - name: f
    min_val: 0.01
    max_val: 100.0
    logscale: true
  fixed_parameters: []
  integrated_variables:
  - name: X
    init_val: 0.778383715217
  - name: Y
    init_val: 0.267086592467
  - name: Z
    init_val: 0.208522420421
  observables: []
population_opt:
  population_size: 4
  num_iters: 1
  processors: 1
  algorithm: DE
  random_seed: 7
  stepsize_rtol:
  - 1.0e-06
  - 1.0e-06
  - 1.0e-06
  stepsize_atol:
  - 7.78383715217e-09
  - 3.2727315626862186e-09
  - 6.797071606673347e-09
gradient_opt:
  gradient_optimizer: adam
  num_iters: 5
  auto_state_tolerances: true
  stepsize_rtol:
  - 1e-7
  - 1e-7
  - 1e-7
  stepsize_atol:
  - 7.78383715217e-10
  - 3.2727315626862187e-10
  - 6.797071606673347e-10
  initial_timestep: 1e-6
  max_steps: 10000
  solver_recovery_max_steps: 50000
  solver_recovery_timeout_seconds: 120
  solver_validation_samples: 32
  solver_validation_max_samples: 128
  solver_validation_success_fraction: 0.25
  solver_validation_seed: 7
  solver_recovery_stagnation_patience: 2
  auto_integrator: true
  integrator: Tsit5
  init_value_lr: 1e-4
  end_value_lr: 1e-5
  transition_steps_lr: 2000
  decay_rate_lr: 0.9
output:
  write_results: true
